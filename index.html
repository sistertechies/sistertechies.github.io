<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SisterTechies — Hand-built AI for legacy businesses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
/* SisterTechies — base styles */

:root {
  /* Printshop palette — warm paper + oxblood ink + tomato accent */
  --bg: oklch(0.945 0.022 78);
  --bg-2: oklch(0.918 0.026 75);
  --paper: oklch(0.97 0.014 80);
  --ink: oklch(0.22 0.045 28);
  --ink-2: oklch(0.36 0.045 30);
  --muted: oklch(0.55 0.030 35);
  --hair: oklch(0.22 0.045 28 / 0.16);
  --hair-2: oklch(0.22 0.045 28 / 0.08);
  --accent: oklch(0.54 0.18 30);          /* tomato red */
  --accent-soft: oklch(0.93 0.055 55);    /* warm peach */
  --accent-ink: oklch(0.44 0.16 30);
  --warn: oklch(0.62 0.16 50);

  --display: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
  --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  --maxw: 1180px;
  --gut: clamp(20px, 4vw, 56px);
  --rad-sm: 12px;
  --rad: 20px;
  --rad-lg: 28px;
}

[data-palette="workshop"] {
  --bg: oklch(0.94 0.018 88);
  --bg-2: oklch(0.91 0.022 85);
  --paper: oklch(0.965 0.012 85);
  --ink: oklch(0.26 0.045 250);
  --ink-2: oklch(0.40 0.045 250);
  --muted: oklch(0.55 0.025 250);
  --hair: oklch(0.26 0.045 250 / 0.16);
  --hair-2: oklch(0.26 0.045 250 / 0.08);
  --accent: oklch(0.66 0.14 75);
  --accent-soft: oklch(0.92 0.06 85);
  --accent-ink: oklch(0.46 0.12 70);
}
[data-palette="mainstreet"] {
  --bg: oklch(0.955 0.018 75);
  --bg-2: oklch(0.93 0.022 70);
  --paper: oklch(0.98 0.010 80);
  --ink: oklch(0.20 0.020 30);
  --ink-2: oklch(0.34 0.020 30);
  --muted: oklch(0.55 0.014 30);
  --hair: oklch(0.20 0.020 30 / 0.16);
  --hair-2: oklch(0.20 0.020 30 / 0.08);
  --accent: oklch(0.52 0.22 25);
  --accent-soft: oklch(0.94 0.05 35);
  --accent-ink: oklch(0.42 0.20 25);
}
[data-palette="quiet"] {
  --bg: oklch(0.965 0.005 80);
  --bg-2: oklch(0.94 0.006 80);
  --paper: oklch(0.99 0.003 80);
  --ink: oklch(0.18 0.008 60);
  --ink-2: oklch(0.32 0.008 60);
  --muted: oklch(0.55 0.008 60);
  --hair: oklch(0.18 0.008 60 / 0.14);
  --hair-2: oklch(0.18 0.008 60 / 0.07);
  --accent: oklch(0.22 0.010 60);
  --accent-soft: oklch(0.92 0.006 80);
  --accent-ink: oklch(0.22 0.010 60);
}
[data-palette="ink"] {
  --bg: oklch(0.16 0.018 30);
  --bg-2: oklch(0.20 0.020 30);
  --paper: oklch(0.22 0.022 30);
  --ink: oklch(0.97 0.012 80);
  --ink-2: oklch(0.86 0.012 80);
  --muted: oklch(0.65 0.010 80);
  --hair: oklch(0.97 0.012 80 / 0.14);
  --hair-2: oklch(0.97 0.012 80 / 0.07);
  --accent: oklch(0.72 0.18 35);
  --accent-soft: oklch(0.32 0.10 35);
  --accent-ink: oklch(0.82 0.16 35);
}

[data-density="compact"] {
  --gut: clamp(16px, 3vw, 36px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 220px 220px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 18px;
  line-height: 1.55;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }

.serif { font-family: var(--display); font-weight: 500; letter-spacing: -0.012em; font-variation-settings: "opsz" 24; }
.mono { font-family: var(--mono); font-weight: 400; letter-spacing: 0.02em; }
.italic { font-style: italic; }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::before {
  content: "";
  display: inline-block;
  width: 18px; height: 1px;
  background: var(--muted);
  opacity: 0.6;
}

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gut);
}

section {
  padding: clamp(64px, 9vw, 128px) 0;
  position: relative;
}

.hairline { border-top: 1px solid var(--hair); }

/* ---- nav ---- */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--hair-2);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px var(--gut);
  max-width: var(--maxw);
  margin: 0 auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.02em;
}
.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--display);
  font-style: italic;
  font-size: 15px;
  padding-bottom: 2px;
}
.brand b { font-weight: 500; }
.brand span { color: var(--muted); }
.nav-links {
  display: flex;
  gap: 28px;
  font-size: 13.5px;
  color: var(--ink-2);
}
.nav-links a:hover { color: var(--accent-ink); }
@media (max-width: 720px) { .nav-links { display: none; } }

/* ---- buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 13px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  cursor: default;
  transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-ghost {
  color: var(--ink-2);
  padding: 13px 4px;
}
.btn-ghost:hover { color: var(--ink); }
.btn .arr {
  display: inline-block;
  transition: transform 0.18s ease;
}
.btn:hover .arr { transform: translateX(3px); }

/* ---- hero ---- */
.hero {
  padding-top: clamp(48px, 7vw, 80px);
  padding-bottom: clamp(56px, 8vw, 96px);
  overflow: hidden;
  position: relative;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: clamp(32px, 5vw, 80px);
  align-items: center;
}
@media (max-width: 920px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.hero h1 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(44px, 6.5vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.022em;
  margin: 22px 0 26px;
  color: var(--ink);
  text-wrap: balance;
}
.hero h1 em {
  font-style: italic;
  color: var(--accent-ink);
}
.hero p.lede {
  font-size: 18.5px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 540px;
  margin: 0 0 32px;
  text-wrap: pretty;
}
.hero .cta-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.hero-meta {
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: clamp(20px, 4vw, 48px);
  justify-content: start;
}
.hero-meta .k { font-family: var(--display); font-size: 32px; line-height: 1; color: var(--ink); }
.hero-meta .v { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

/* ---- premise (quote) ---- */
.premise {
  padding-top: clamp(48px, 7vw, 96px);
  padding-bottom: clamp(48px, 7vw, 96px);
}
.premise-inner {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: clamp(24px, 5vw, 80px);
  align-items: start;
}
@media (max-width: 860px) {
  .premise-inner { grid-template-columns: 1fr; }
}
.premise-q {
  font-family: var(--display);
  font-size: clamp(28px, 3.6vw, 46px);
  line-height: 1.12;
  letter-spacing: -0.012em;
  color: var(--ink);
  text-wrap: balance;
  margin: 0;
}
.premise-q em { font-style: italic; color: var(--accent-ink); }

/* ---- services ---- */
.services {
  background: var(--bg-2);
}
.services-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 32px;
  margin-bottom: 56px;
  flex-wrap: wrap;
}
.h-section {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(36px, 4.5vw, 60px);
  line-height: 1.02;
  letter-spacing: -0.018em;
  margin: 14px 0 0;
  max-width: 720px;
  text-wrap: balance;
}
.h-section em { font-style: italic; color: var(--accent-ink); }
.services-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  overflow: hidden;
}
@media (max-width: 760px) { .services-grid { grid-template-columns: 1fr; } }
.service {
  background: var(--paper);
  padding: 36px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 280px;
  position: relative;
  transition: background 0.25s ease;
}
.service:hover { background: var(--bg); }
.service .ix {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
}
.service h3 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.01em;
  line-height: 1.05;
  margin: 0;
}
.service h3 em { font-style: italic; color: var(--accent-ink); }
.service p {
  color: var(--ink-2);
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  max-width: 44ch;
}
.service .tag {
  margin-top: auto;
  align-self: start;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-ink);
  background: var(--accent-soft);
  padding: 6px 10px;
  border-radius: 999px;
}

/* ---- case study ---- */
.case {
  position: relative;
}
.case-head {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(24px, 5vw, 64px);
  margin-bottom: 56px;
  align-items: end;
}
@media (max-width: 860px) { .case-head { grid-template-columns: 1fr; } }
.case-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 56px;
  border-top: 1px solid var(--hair);
  padding-top: 32px;
}
@media (max-width: 600px) { .case-stats { grid-template-columns: 1fr 1fr; } }
.case-stat .k { font-family: var(--display); font-size: clamp(40px, 5vw, 56px); line-height: 1; }
.case-stat .k em { font-style: italic; color: var(--accent-ink); }
.case-stat .v { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

.case-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(24px, 5vw, 80px);
  align-items: center;
}
@media (max-width: 860px) { .case-stage { grid-template-columns: 1fr; } }

.case-steps {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.case-step {
  padding: 18px 0;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 18px;
  border-top: 1px solid var(--hair);
  cursor: default;
  transition: opacity 0.25s ease;
  opacity: 0.42;
}
.case-step:last-child { border-bottom: 1px solid var(--hair); }
.case-step.active { opacity: 1; }
.case-step .num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--muted);
  padding-top: 6px;
}
.case-step.active .num { color: var(--accent-ink); }
.case-step h4 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 22px;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.case-step p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
.case-step .bar {
  grid-column: 2;
  height: 2px;
  background: var(--hair);
  border-radius: 999px;
  margin-top: 12px;
  overflow: hidden;
  display: none;
}
.case-step.active .bar { display: block; }
.case-step .bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  width: var(--p, 0%);
  transition: width 0.18s linear;
}

/* ---- pricing ---- */
.pricing {
  background: var(--bg);
}
.pricing-head {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(24px, 5vw, 80px);
  align-items: end;
  margin-bottom: 56px;
}
@media (max-width: 860px) { .pricing-head { grid-template-columns: 1fr; } }
.pricing-promises {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--ink-2);
  font-size: 15.5px;
}
.pricing-promises li {
  padding-left: 22px;
  position: relative;
  line-height: 1.55;
}
.pricing-promises li::before {
  content: "·";
  position: absolute;
  left: 4px;
  top: -2px;
  color: var(--accent-ink);
  font-size: 24px;
  line-height: 1;
}
.pricing-promises em {
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: 17.5px;
  color: var(--ink);
}

.pricing-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  overflow: hidden;
}
@media (max-width: 1080px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .pricing-grid { grid-template-columns: 1fr; } }

.tier {
  background: var(--paper);
  padding: 32px 28px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 320px;
  position: relative;
  transition: background 0.25s ease;
}
.tier:hover { background: var(--bg); }
.tier-em {
  background: var(--accent-soft);
}
.tier-em:hover { background: var(--accent-soft); }
.tier-em::before {
  content: "Where most start";
  position: absolute;
  top: -1px;
  right: 16px;
  background: var(--accent);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 9px;
  border-radius: 0 0 6px 6px;
}

.tier-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-ink);
  font-weight: 500;
}
.tier-em .tier-tag { color: var(--accent-ink); }

.tier-name {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(28px, 2.4vw, 34px);
  letter-spacing: -0.015em;
  line-height: 1.0;
  margin: 0;
}
.tier-name em { font-style: italic; }

.tier-body {
  margin: 0;
  color: var(--ink-2);
  font-size: 14.5px;
  line-height: 1.55;
  flex: 1;
}
.tier-em .tier-body { color: var(--accent-ink); }

.tier-fine {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--hair);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.tier-em .tier-fine {
  border-top-color: oklch(from var(--accent) l c h / 0.25);
  color: var(--accent-ink);
  opacity: 0.85;
}

.pricing-compare {
  margin-top: 48px;
  padding: 32px clamp(20px, 3vw, 36px);
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(20px, 4vw, 56px);
  align-items: center;
}
@media (max-width: 760px) { .pricing-compare { grid-template-columns: 1fr; } }

.compare-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.compare-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: baseline;
  padding: 6px 0;
  font-size: 15px;
  color: var(--ink-2);
}
.compare-k { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--ink); }
.compare-dots {
  border-bottom: 1px dotted var(--hair);
  height: 1px;
  align-self: end;
  margin-bottom: 4px;
}
.compare-v {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent-ink);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.compare-line {
  margin: 0;
  font-size: 15.5px;
  color: var(--ink-2);
  line-height: 1.55;
}
.compare-line em {
  font-family: var(--display);
  font-style: italic;
  color: var(--ink);
  font-size: 17.5px;
}

/* ---- field studies ---- */
.field {
  background: var(--bg);
}
.field-head {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: clamp(24px, 5vw, 80px);
  align-items: end;
  margin-bottom: 56px;
}
@media (max-width: 860px) { .field-head { grid-template-columns: 1fr; } }
.field-intro {
  margin: 0;
  color: var(--ink-2);
  font-size: 15.5px;
  line-height: 1.6;
}
.field-intro em {
  font-family: var(--display);
  font-style: italic;
  font-size: 17px;
  color: var(--ink);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  overflow: hidden;
}
@media (max-width: 720px) { .field-grid { grid-template-columns: 1fr; } }

.field-card {
  background: var(--paper);
  padding: 28px 28px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  transition: background 0.25s ease;
}
.field-card:hover { background: var(--bg); }

.field-card-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.field-card-h .ix em {
  font-style: italic;
  font-family: var(--display);
  text-transform: none;
  letter-spacing: 0;
  margin: 0 2px;
  color: var(--ink-2);
}
.field-card-h .biz {
  color: var(--accent-ink);
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 999px;
  letter-spacing: 0.08em;
}

.field-name {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(22px, 2.2vw, 30px);
  line-height: 1.08;
  letter-spacing: -0.015em;
  margin: 6px 0 8px;
  color: var(--ink);
  text-wrap: balance;
}
.field-name em { font-style: italic; color: var(--accent-ink); }

.field-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 14px;
  padding: 10px 0;
  border-top: 1px solid var(--hair-2);
}
.field-lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 4px;
}
.field-row p {
  margin: 0;
  color: var(--ink-2);
  font-size: 14.5px;
  line-height: 1.5;
}

.field-foot {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--hair);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.field-result { color: var(--accent-ink); font-weight: 500; }

.field-cta {
  margin-top: 40px;
  padding: 28px 32px;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.field-cta p {
  margin: 0;
  color: var(--ink-2);
  font-size: 16px;
  max-width: 540px;
}
.field-cta p .serif { color: var(--ink); font-size: 22px; margin-right: 6px; }

/* ---- sisters ---- */
.sisters-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(20px, 3vw, 36px);
  margin-top: 48px;
}
@media (max-width: 760px) { .sisters-grid { grid-template-columns: 1fr; } }
.sister {
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: var(--rad);
  padding: 32px 28px 28px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 16px;
}
.sister-portrait {
  aspect-ratio: 4 / 3;
  border-radius: var(--rad-sm);
  background:
    repeating-linear-gradient(135deg, var(--hair-2) 0 1px, transparent 1px 12px),
    var(--bg-2);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.sister-portrait .ph {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
  padding: 6px 10px;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 6px;
}
.sister h3 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 34px;
  margin: 0;
  letter-spacing: -0.01em;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.sister h3 em { font-style: italic; color: var(--accent-ink); font-size: 18px; }
.sister .role {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.sister p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
.sister .skills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.skill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--ink-2);
  border: 1px solid var(--hair);
}

/* ---- process ---- */
.process {
  background: var(--bg-2);
}
.process-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(20px, 3vw, 40px);
  margin-top: 56px;
  position: relative;
}
@media (max-width: 760px) { .process-grid { grid-template-columns: 1fr; } }
.proc {
  padding: 0;
}
.proc .ix {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.12em;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.proc .ix b { font-weight: 500; color: var(--accent-ink); }
.proc h4 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 30px;
  letter-spacing: -0.01em;
  line-height: 1.05;
  margin: 0 0 12px;
}
.proc h4 em { font-style: italic; color: var(--accent-ink); }
.proc p { color: var(--ink-2); margin: 0; font-size: 15px; line-height: 1.55; }
.proc .when {
  margin-top: 18px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 14px;
  border-top: 1px solid var(--hair);
}

/* ---- cta ---- */
.cta {
  background: var(--ink);
  color: var(--bg);
}
.cta .h-section { color: var(--bg); }
.cta .h-section em { color: oklch(from var(--accent) max(0.78, l) c h); }
.cta-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(24px, 5vw, 80px);
  align-items: end;
}
@media (max-width: 860px) { .cta-inner { grid-template-columns: 1fr; } }
.cta p { color: oklch(from var(--bg) l c h / 0.7); font-size: 17px; max-width: 460px; margin: 24px 0 0; }
.cta-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cta-input {
  display: flex;
  align-items: center;
  gap: 10px;
  background: oklch(from var(--bg) l c h / 0.08);
  border: 1px solid oklch(from var(--bg) l c h / 0.18);
  border-radius: 14px;
  padding: 6px 6px 6px 18px;
  transition: border 0.2s ease, background 0.2s ease;
}
.cta-input:focus-within {
  border-color: oklch(from var(--bg) l c h / 0.4);
  background: oklch(from var(--bg) l c h / 0.12);
}
.cta-input input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: var(--bg);
  font: inherit;
  font-size: 15px;
  padding: 10px 0;
}
.cta-input input::placeholder { color: oklch(from var(--bg) l c h / 0.45); }
.cta-input .send {
  background: var(--bg);
  color: var(--ink);
  border-radius: 10px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.cta-input .send:hover { transform: translateY(-1px); }
.cta-or {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: oklch(from var(--bg) l c h / 0.45);
  display: flex;
  align-items: center;
  gap: 12px;
}
.cta-or::before, .cta-or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: oklch(from var(--bg) l c h / 0.18);
}
.cta-alt {
  display: flex;
  gap: 18px;
  font-size: 14.5px;
  color: oklch(from var(--bg) l c h / 0.85);
  align-items: center;
  flex-wrap: wrap;
}
.cta-alt a { text-decoration: underline; text-decoration-color: oklch(from var(--bg) l c h / 0.3); text-underline-offset: 4px; }
.cta-alt a:hover { text-decoration-color: var(--bg); }



.cta-route {
  margin: 18px 0 0 !important;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: oklch(from var(--bg) l c h / 0.55) !important;
}
.cta-route span { color: oklch(from var(--accent) max(0.78, l) c h); }

/* ---- contact form ---- */
.st-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.st-field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 540px) { .st-field-row { grid-template-columns: 1fr; } }
.st-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.st-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: oklch(from var(--bg) l c h / 0.55);
}
.st-label em {
  font-style: normal;
  color: oklch(from var(--bg) l c h / 0.3);
  margin: 0 6px;
}
.st-field input,
.st-field textarea {
  width: 100%;
  background: oklch(from var(--bg) l c h / 0.06);
  border: 1px solid oklch(from var(--bg) l c h / 0.18);
  border-radius: 12px;
  padding: 13px 16px;
  font-family: var(--sans);
  font-size: 15px;
  color: var(--bg);
  outline: none;
  resize: vertical;
  transition: border 0.2s ease, background 0.2s ease;
}
.st-field textarea {
  min-height: 110px;
  line-height: 1.5;
}
.st-field input::placeholder,
.st-field textarea::placeholder {
  color: oklch(from var(--bg) l c h / 0.35);
}
.st-field input:focus,
.st-field textarea:focus {
  border-color: oklch(from var(--bg) l c h / 0.45);
  background: oklch(from var(--bg) l c h / 0.12);
}
.st-field input:disabled,
.st-field textarea:disabled { opacity: 0.6; cursor: wait; }
.st-error {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: oklch(from var(--accent) max(0.78, l) c h);
  padding: 4px 2px 0;
}
.st-error a { text-decoration: underline; color: inherit; }
.st-submit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.st-form .send {
  background: var(--bg);
  color: var(--ink);
  border: none;
  border-radius: 12px;
  padding: 13px 22px;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.st-form .send:hover:not(:disabled) { transform: translateY(-1px); }
.st-form .send:disabled { opacity: 0.5; cursor: wait; }
.st-fine {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: oklch(from var(--bg) l c h / 0.45);
}

/* ---- footer ---- */
.foot {
  padding: 28px 0 32px;
  border-top: 1px solid var(--hair-2);
}
.foot-inner {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.foot a:hover { color: var(--ink); }

/* ---- phone demo ---- */
.phone-stage {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 600px;
  padding: 24px 0;
  isolation: isolate;
}

.phone-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(60% 50% at 50% 55%, var(--accent-soft) 0%, transparent 70%);
  opacity: 0.6;
  z-index: -1;
  pointer-events: none;
}

.phone {
  width: 320px;
  height: 660px;
  border-radius: 48px;
  background: oklch(0.15 0.01 60);
  padding: 8px;
  position: relative;
  box-shadow:
    0 1px 0 oklch(0.4 0.01 60) inset,
    0 36px 80px -32px oklch(0.18 0.01 60 / 0.45),
    0 8px 30px -8px oklch(0.18 0.01 60 / 0.25);
}

.phone::before, .phone::after {
  content: "";
  position: absolute;
  background: oklch(0.10 0.005 60);
  border-radius: 2px;
}
.phone::before { left: -2px; top: 120px; width: 3px; height: 30px; }
.phone::after { right: -2px; top: 130px; width: 3px; height: 50px; }

.phone-side-2 {
  position: absolute;
  left: -2px;
  top: 160px;
  width: 3px;
  height: 50px;
  background: oklch(0.10 0.005 60);
  border-radius: 2px;
}
.phone-side-3 {
  position: absolute;
  right: -2px;
  top: 200px;
  width: 3px;
  height: 50px;
  background: oklch(0.10 0.005 60);
  border-radius: 2px;
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 40px;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}

.phone-notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 28px;
  background: oklch(0.10 0.005 60);
  border-radius: 999px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
}
.phone-notch i {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: oklch(0.32 0.04 230);
  box-shadow: 0 0 0 1.5px oklch(0.14 0.005 60);
}

.phone-statusbar {
  height: 48px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 22px 8px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  color: oklch(0.18 0.012 60);
  position: relative;
  z-index: 21;
}
.phone-statusbar .right {
  display: flex;
  gap: 5px;
  align-items: center;
}
.phone-statusbar .right svg { width: 16px; height: 11px; }

[data-palette="ink"] .phone-statusbar { color: var(--ink); }

.scene {
  position: absolute;
  inset: 48px 0 0 0;
  overflow: hidden;
}

.scene-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.scene-inner.exit-up { opacity: 0; transform: translateY(-16px); }
.scene-inner.exit-down { opacity: 0; transform: translateY(16px); }
.scene-inner.enter-up { opacity: 0; transform: translateY(16px); animation: enter-in 0.5s 0.05s cubic-bezier(0.2,0.7,0.2,1) forwards; }
@keyframes enter-in { to { opacity: 1; transform: translateY(0); } }

.app-bar {
  padding: 14px 22px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--hair);
}
.app-bar .crumb { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.app-bar .crumb b { color: var(--accent-ink); font-weight: 500; }
.app-bar .pill {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 8px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  border-radius: 999px;
}

.app-body { padding: 20px 22px; flex: 1; overflow: hidden; }

.s1 .ordhead {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  line-height: 1.1;
}
.s1 .ordhead em { font-style: italic; color: var(--accent-ink); }
.s1 .ordsub { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.04em; margin: 0 0 18px; }

.qc {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.qc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--hair);
  border-radius: 10px;
  font-size: 12.5px;
  transition: background 0.3s ease, border-color 0.3s ease;
  background: var(--paper);
}
.qc-item.checked {
  background: oklch(from var(--accent-soft) l c h / 0.7);
  border-color: oklch(from var(--accent) l c h / 0.3);
}
.qc-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--hair);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.qc-item.checked .qc-check {
  background: var(--accent);
  border-color: var(--accent);
}
.qc-check svg {
  width: 10px; height: 10px;
  stroke: var(--paper);
  stroke-width: 3;
  fill: none;
  opacity: 0;
  transition: opacity 0.2s ease 0.15s;
}
.qc-item.checked .qc-check svg { opacity: 1; }

.s2 .ordhead { font-family: var(--display); font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.s2 .ordsub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin: 0 0 14px; }

.photo-frame {
  border-radius: 14px;
  aspect-ratio: 4 / 5;
  background:
    radial-gradient(circle at 50% 40%, oklch(0.78 0.10 25) 0 12%, transparent 12.5%),
    radial-gradient(circle at 38% 48%, oklch(0.82 0.10 18) 0 8%, transparent 8.5%),
    radial-gradient(circle at 62% 48%, oklch(0.82 0.10 18) 0 8%, transparent 8.5%),
    radial-gradient(circle at 50% 60%, oklch(0.72 0.12 30) 0 10%, transparent 10.5%),
    radial-gradient(circle at 44% 38%, oklch(0.55 0.10 145) 0 4%, transparent 4.5%),
    radial-gradient(circle at 56% 38%, oklch(0.55 0.10 145) 0 4%, transparent 4.5%),
    linear-gradient(180deg, oklch(0.92 0.04 90), oklch(0.85 0.05 100));
  position: relative;
  overflow: hidden;
  border: 1px solid var(--hair);
}
.photo-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, oklch(0.20 0.02 90 / 0.25));
}
.photo-frame .meta {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  z-index: 1;
  font-family: var(--mono);
  font-size: 9.5px;
  color: oklch(0.96 0.01 90);
  letter-spacing: 0.08em;
}
.photo-frame .meta span { background: oklch(0.18 0.01 60 / 0.45); padding: 4px 7px; border-radius: 5px; backdrop-filter: blur(6px); }

.shutter {
  margin: 16px auto 0;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ink);
  display: grid;
  place-items: center;
  position: relative;
}
.shutter::after {
  content: "";
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2.5px solid var(--bg);
}
.shutter-pulse {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  opacity: 0;
  animation: shutter-pulse 1.6s ease-out infinite;
}
@keyframes shutter-pulse {
  0% { opacity: 0.8; transform: scale(0.85); }
  70% { opacity: 0; transform: scale(1.25); }
  100% { opacity: 0; }
}
.s2-caption {
  text-align: center;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 12px;
}

.s3 .ordhead { font-family: var(--display); font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.s3 .ordsub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin: 0 0 14px; }

.map-frame {
  border-radius: 14px;
  height: 200px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--hair);
  background:
    linear-gradient(120deg, oklch(0.93 0.012 90) 0%, oklch(0.95 0.014 90) 100%);
}
.map-frame::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, transparent 30%, oklch(0.86 0.014 100) 30.2%, transparent 30.4%),
    linear-gradient(90deg, transparent 68%, oklch(0.86 0.014 100) 68.2%, transparent 68.4%),
    linear-gradient(0deg, transparent 35%, oklch(0.86 0.014 100) 35.2%, transparent 35.4%),
    linear-gradient(0deg, transparent 70%, oklch(0.86 0.014 100) 70.2%, transparent 70.4%);
}
.map-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 40%, oklch(0.88 0.04 145) 0 9%, transparent 9.5%),
    radial-gradient(circle at 78% 72%, oklch(0.88 0.04 145) 0 7%, transparent 7.5%);
  opacity: 0.7;
}
.pin {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -100%);
  z-index: 3;
}
.pin .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--ink);
  border: 2.5px solid var(--bg);
  box-shadow: 0 4px 10px oklch(0.18 0.01 60 / 0.4);
  position: relative;
}
.pin .ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  opacity: 0;
  animation: pin-ring 2s ease-out infinite;
}
@keyframes pin-ring {
  0% { opacity: 0.6; transform: scale(0.5); }
  80% { opacity: 0; transform: scale(2.5); }
  100% { opacity: 0; }
}
.gps-readout {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--hair);

// ── tweaks-panel ──────────────────────────────────────────────────────────────

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) ro.observe(document.documentElement);
    else window.addEventListener('resize', clampToViewport);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', clampToViewport); };
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

function TweakSelect({ label, value, options, onChange }) {

        {options.map((o) => {

          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;

}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  return (

      <div role="radiogroup" style={{ position:'relative', display:'flex', padding:'2px', borderRadius:'8px', background:'rgba(0,0,0,.06)', userSelect:'none' }}>

        {opts.map((o) => (
          <button key={o.value} type="button" onClick={() => onChange(o.value)}

            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function PhoneDemo({ speed = 1, autoplay = true }) {

  const timeoutRef = React.useRef(null);
  const startRef = React.useRef(performance.now());

  React.useEffect(() => {
    let raf;
    startRef.current = performance.now();
    const dur = SCENES[idx].dur / speed;
    const step = (t) => {
      const elapsed = t - startRef.current;
      setTick(Math.min(1, elapsed / dur));
      if (elapsed < dur) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [idx, speed]);

  React.useEffect(() => {
    if (!autoplay) return;
    timeoutRef.current = setTimeout(() => {
      setIdx((i) => (i + 1) % SCENES.length);
    }, SCENES[idx].dur / speed);
    return () => clearTimeout(timeoutRef.current);
  }, [idx, autoplay, speed]);

  const renderScene = () => {
    const s = SCENES[idx];
    if (s.id === 'qc') return <SceneQC key={idx} tick={tick} />;
    if (s.id === 'shop') return <SceneShop key={idx} />;
    if (s.id === 'door') return <SceneDoor key={idx} tick={tick} />;
    return <SceneTrust key={idx} />;
  };

  return (
    <div className="phone-stage">
      <span className="phone-glow"></span>
      <div className="phone">
        <span className="phone-side-2"></span>
        <span className="phone-side-3"></span>
        <div className="phone-screen">
          <div className="phone-notch"><i></i></div>
          <StatusBar />
          <div className="scene">{renderScene()}</div>
          <div className="phone-progress">
            {SCENES.map((s, i) => (
              <i key={`${s.id}-${i}`}
                 className={i < idx ? 'done' : i === idx ? 'active' : ''}
                 style={i === idx ? { '--dur': `${SCENES[idx].dur / speed}ms` } : {}}
              ></i>
            ))}
          </div>
        </div>
      </div>
      <div className="phone-caption">
        FloristVerify <b>· {SCENES[idx].label}</b>
      </div>
    </div>
  );
}

function CTA() {
  const [name, setName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [business, setBusiness] = React.useState('');
  const [message, setMessage] = React.useState('');
  const [status, setStatus] = React.useState('idle');
  const [error, setError] = React.useState('');

  const submit = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (status === 'sending') return;
    if (message.trim().length < 4) {
      setError('Tell us a sentence — even a short one.');
      return;
    }
    if (!email.trim()) {
      setError('We need an email to write back.');
      return;
    }
    setError('');
    setStatus('sending');
    try {
      const res = await fetch('https://formspree.io/f/mdabjjye', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          email,
          business,
          message,
          _subject: 'New SisterTechies inquiry: ' + (business || name || 'no name'),
          source: 'sistertechies landing page',
        }),
      });
      setStatus(res.ok ? 'sent' : 'error');
    } catch (e) {
      setStatus('error');
    }
  };

  const sent = status === 'sent';
  const sending = status === 'sending';

  return (
    <section className="cta" id="contact">
      <div className="wrap">
        <div className="cta-inner">
          <div>
            <span className="eyebrow" style={{ color: 'oklch(from var(--bg) l c h / 0.55)' }}>Write to us</span>
            <h2 className="h-section">Tell us the <em>one thing</em><br/>keeping you up.</h2>
            <p>
              No deck. No discovery package. Just one sentence about what's broken — and we'll
              write back by end of day with whether it's a 48-hour fix, a 2-week build, or
              something a spreadsheet still does better.
            </p>
          </div>
          <div className="cta-form">
            {!sent ? (
              <form className="st-form" onSubmit={submit} noValidate>
                <div className="st-field-row">
                  <label className="st-field">
                    <span className="st-label">Your name</span>
                    <input
                      type="text"
                      name="name"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Margaret R."
                      disabled={sending}
                    />
                  </label>
                  <label className="st-field">
                    <span className="st-label">Email <em>·</em> we write back here</span>
                    <input
                      type="email"
                      name="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="you@yourbusiness.com"
                      disabled={sending}
                    />
                  </label>
                </div>
                <label className="st-field">
                  <span className="st-label">Your shop <em>·</em> optional</span>
                  <input
                    type="text"
                    name="business"
                    value={business}
                    onChange={(e) => setBusiness(e.target.value)}
                    placeholder="Business and Location"
                    disabled={sending}
                  />
                </label>
                <label className="st-field">
                  <span className="st-label">The one thing keeping you up</span>
                  <textarea
                    name="message"
                    rows="4"
                    required
                    value={message}
                    onChange={(e) => setMessage(e.target.value)}
                    placeholder="My customers keep calling to ask…"
                    disabled={sending}
                  />
                </label>
                {error && <div className="st-error">{error}</div>}
                {status === 'error' && !error && (
                  <div className="st-error">
                    Hmm, that didn't go through. Email <a href="mailto:sistertechies@gmail.com">sistertechies@gmail.com</a> directly?
                  </div>
                )}
                <div className="st-submit-row">
                  <button type="submit" className="send" disabled={sending}>
                    {sending ? 'Sending…' : 'Send to the sisters'}
                    {!sending && <span style={{ display: 'inline-block', marginLeft: 6 }}>→</span>}
                  </button>
                  <span className="st-fine">
                    We read every one. No autoresponders, no funnels.
                  </span>
                </div>
              </form>
            ) : (
              <div style={{ padding: '32px 24px', border: '1px solid oklch(from var(--bg) l c h / 0.2)', borderRadius: 18, background: 'oklch(from var(--bg) l c h / 0.06)' }}>
                <div className="eyebrow" style={{ color: 'oklch(from var(--accent) max(0.78, l) c h)' }}>Got it</div>
                <p style={{ fontFamily: 'var(--display)', fontSize: 26, margin: '10px 0 6px', color: 'var(--bg)', lineHeight: 1.1 }}>
                  Eva will write back today.
                </p>
                <p style={{ margin: 0, color: 'oklch(from var(--bg) l c h / 0.6)', fontSize: 14 }}>
                  Usually before 6pm Eastern. If it's a weekend, before Sunday brunch.
                </p>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="foot">
      <div className="wrap foot-inner">
        <span>© 2026 SisterTechies Studio · Made by Eva &amp; Sivan</span>
        <span>New York · Boston · anywhere by Zoom</span>
      </div>
    </footer>
  );
}

// ── app ───────────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = {
  palette: 'printshop',
  density: 'regular',
  tagline: 0,
  speed: 1,
};

const TAGLINES = [
  {
    h: 'Hand-built AI<br/>for <em>legacy</em> businesses.',
    s: 'Eva identifies the operational bottlenecks. Sivan builds the systems that fix them. Small businesses get practical tools that save time, reduce friction, and keep work moving.',
  },
  {
    h: 'Software that quietly<br/>fixes the <em>thing</em>.',
    s: 'A two-sister AI studio for small businesses too busy to be reinvented. We don’t platform you. We solve one nagging problem at a time.',
  },
  {
    h: 'The opposite of<br/><em>enterprise</em> software.',
    s: 'Custom AI for florists, bakeries, plumbers, dentists, and every business a VC has never heard of. Built in 48 hours. Owned by you.',
  },
  {
    h: 'Your bad reviews,<br/><em>solved in a weekend.</em>',
    s: 'We look at what’s costing you stars, money, and sleep. Then we ship the smallest possible tool that makes the complaint impossible to file.',
  },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.dataset.palette = t.palette;
    document.documentElement.dataset.density = t.density;
  }, [t.palette, t.density]);

  const tag = TAGLINES[t.tagline % TAGLINES.length];

  return (
    <>
      <Nav />
      <Hero tagline={tag.h} sub={tag.s} speed={t.speed} />
      <Premise />
      <Services />
      <Pricing />
      <CaseStudy speed={t.speed} />
      <FieldStudies />
      <Sisters />
      <Process />
      <CTA />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Look" />
        <TweakSelect
          label="Palette"
          value={t.palette}
          options={[
            { value: 'printshop', label: 'Printshop · oxblood + tomato' },
            { value: 'workshop', label: 'Workshop · navy + ochre' },
            { value: 'mainstreet', label: 'Main Street · awning red' },
            { value: 'quiet', label: 'Quiet · plain mono' },
            { value: 'ink', label: 'Ink · dark mode' },
          ]}
          onChange={(v) => setTweak('palette', v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={['compact', 'regular']}
          onChange={(v) => setTweak('density', v)}
        />
        <TweakSection label="Hero" />
        <TweakSelect
          label="Tagline"
          value={t.tagline}
          options={TAGLINES.map((tg, i) => ({
            value: i,
            label: tg.h.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 38) + '…',
          }))}
          onChange={(v) => setTweak('tagline', Number(v))}
        />
        <TweakSection label="Phone demo" />
        <TweakSlider
          label="Cycle speed"
          value={t.speed}
          min={0.5}
          max={2.5}
          step={0.1}
          unit="×"
          onChange={(v) => setTweak('speed', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  
</script>
</body>
</html>
